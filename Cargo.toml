[package]
name = "vibe"
version = "0.2.7"
edition = "2024"
rust-version = "1.88"
description = "A native desktop workspace for independent AI conversations"
license = "MIT"
repository = "https://github.com/Szilaay/Vibe"
default-run = "vibe"
publish = false

[dependencies]
anyhow = "1"
ed25519-dalek = "2.2"
semver = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
cpal = "0.15"
hound = "3.5"
directories = "6"
futures-util = "0.3"
fs2 = "0.4"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.33.3", default-features = false, features = ["svg"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
jsonwebtoken = "9.3"
open = "5"
portable-pty = "0.9"
rand = "0.8"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
# Preserve image-only paste shortcuts for the embedded original Codex TUI.
egui-winit = { path = "vendor/egui-winit" }

[[bin]]
name = "vibe"
path = "src/desktop.rs"

[[bin]]
name = "vibe-cli"
path = "src/main.rs"

[[bin]]
name = "vibe-release"
path = "src/release_tool.rs"
